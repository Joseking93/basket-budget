name: Release

# Push a tag like 3.5 and GitHub builds the APK, signs it with the stored key
# and attaches it to a release. The app's update check then finds it.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Put the signing key back together
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Check the tag matches the version in the build file
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$NAME" ]; then
            echo "Tag $TAG does not match versionName $NAME — the app would never see this as an update." >&2
            exit 1
          fi

      - name: Build and sign
        env:
          BB_KEYSTORE: ${{ runner.temp }}/release.jks
          BB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BB_KEY_ALIAS: basketbudget
          BB_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name it something a person would recognise
        run: cp app/build/outputs/apk/release/app-release.apk BudgetTracker.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: BudgetTracker.apk
          generate_release_notes: true
          name: Budget Tracker ${{ github.ref_name }}
